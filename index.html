<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LMNP Manager</title><style>
:root{font:15px system-ui;color:#172235;background:#f3f5f9}*{box-sizing:border-box}body{margin:0}header{background:#172b4d;color:white;padding:20px 4vw}header h1{margin:0}header p{margin:5px 0 0;color:#cbd5e1}main{max-width:1450px;margin:auto;padding:24px;display:grid;grid-template-columns:245px minmax(0,1fr);gap:22px;align-items:start}#app{grid-column:2;grid-row:1;min-width:0}#tabs{grid-column:1;grid-row:1;position:sticky;top:20px;display:flex;flex-direction:column;background:white;border:1px solid #e2e8f0;border-radius:12px;padding:12px;gap:5px}#tabs button{text-align:left;width:100%;border:0}@media(max-width:750px){main{display:flex;flex-direction:column}#tabs{position:static;width:100%}#app{width:100%}}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}button,.btn{border:1px solid #cbd5e1;background:white;border-radius:8px;padding:10px 14px;cursor:pointer;color:#172235}button.active,button.primary{background:#2456a6;color:white;border-color:#2456a6}.panel{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:20px;margin-bottom:16px}h2{margin-top:0;font-size:20px}h3{font-size:16px}label{display:block;font-weight:600;margin:10px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;background:white;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e2e8f0}small,.muted{color:#64748b}.scroll{overflow:auto}.hidden{display:none}.metric{font-size:26px;font-weight:700}.warn{color:#a16207}footer{text-align:center;color:#64748b;padding:20px}input[type=file]{max-width:100%}main{grid-template-columns:280px minmax(0,1fr);gap:0;max-width:none;padding:0;min-height:calc(100vh - 100px)}#tabs{background:#2c3e50;color:#fff;border:0;border-radius:0;padding:0;top:0;min-height:calc(100vh - 100px);gap:0;box-shadow:2px 0 5px rgba(0,0,0,.1)}#tabs button{color:#bdc3c7;background:transparent;border:0;border-left:4px solid transparent;border-radius:0;padding:15px 20px;font-size:15px}#tabs button:hover,#tabs button.active{background:#34495e;color:#fff;border-left:4px solid #0056b3}#app{padding:30px;max-width:1450px;width:100%}.lmnp-brand{padding:20px;text-align:center;border-bottom:1px solid rgba(255,255,255,.1)}.lmnp-brand strong{display:block;font-size:21px;margin-bottom:14px}.mysun-signature{display:flex;align-items:center;justify-content:center;background:white;border-radius:10px;padding:7px 10px;min-height:62px}.mysun-signature img{display:block;width:100%;max-width:190px;height:auto;object-fit:contain}@media(max-width:750px){main{display:flex;padding:0}#tabs{min-height:auto;width:100%}#app{padding:16px}} </style></head><body>
<header><h1>LMNP Manager</h1><p>Comptabilité locale • aucune donnée personnelle envoyée à GitHub</p></header><main><nav id="tabs"></nav><div id="app"></div></main><footer>Version 0.1 • Sauvegardez régulièrement votre dossier JSON. Les calculs fiscaux ne sont pas encore disponibles.</footer>
<script>
'use strict';
const KEY='lmnp-manager-v1';const tabs=['Tableau de bord','Propriétaires','Biens','Comptabilité','Plan comptable','Immobilisations','Fiscalité','Documents','Contrôle fiscal','Exercices','Paramètres','Sauvegarde'];
const blank=()=>({schema:1,owners:[],properties:[],entries:[],documents:[],years:[],updated:new Date().toISOString()});
let db=blank(),tab=0;
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>crypto.randomUUID(),money=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n||0);
function persist(){db.updated=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Stockage navigateur saturé : exportez votre dossier JSON. '+e.message)}render()}
function fields(names){return names.map(([k,l,t='text',required=true])=>'<div><label>'+l+'</label><input name="'+k+'" type="'+t+'" '+(required?'required':'')+'></div>').join('')}
function form(name,inner){return '<form id="'+name+'"><div class="grid">'+inner+'</div><div class="actions"><button class="primary">Ajouter</button></div></form>'}
function options(items,field){return items.map(x=>'<option value="'+esc(x.id)+'">'+esc(x[field])+'</option>').join('')}
function section(title,body){return '<section class="panel"><h2>'+title+'</h2>'+body+'</section>'}
function table(head,rows){return '<div class="scroll"><table><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}
function remove(type,item){if(!confirm('Supprimer cet élément ?'))return;db[type]=db[type].filter(x=>x.id!==item);persist()}
function add(type,formId,extra={}){const f=$(formId);if(!f.reportValidity())return;const obj=Object.fromEntries(new FormData(f));db[type].push({id:id(),...obj,...extra});persist()}
function render(){
$('tabs').innerHTML='<div class="lmnp-brand"><strong>LMNP Manager</strong><div class="mysun-signature"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAL4AAABCBAMAAAAbCnHMAAAAMFBMVEUAAAAYHB38rlIPEhISFRX6zUn50j35p1f30lD7p1r7pln5zkz4zUz56hr/AAD/fw8GO28DAAAAEHRSTlMB9vtgovr+HxyhXqFgCgECAEXI+QAABb5JREFUeNrtmE9oHFUcxz+zb9IN4q7zSDyWLlOhraTNSzctPRjZ2IAVry1YUPBYQWFRmraCsCCt2lPAg2gphIIEWrwIgtaULi3eTPpKCkUkYWt7TJjVQM3Kzq6HNzM7+zdJkxwE32Vm3rz9zu99f/++b+E/NpL5ncX/8OWmx8S2f6C+Y/jnOrC0jfjJGw3qr+wLbuztwxcMR58q9G2//T6fNz51fvvxK4UI7Az3O+OryILRiQnVSoACRDabzWY7/QRdCR2gumSBNRhCSSmlzDXDy0FgXEop5WA0OyKjDzznXoXLM5B0960Tn4cAeNA0l8ZvcB2BlsylAPjiMkyeBpgEUvmu+KIk9nhexo9vYMRc7riu62Zwwh2by/O/F6By8o1gNr8AvH+zKz+WoUYOxN7JQUu2kzIupQL6Tr0V5Nj16zN50kDSPQDYCLkMYL9StB3fnwBmUY+LAJkSMOpA/RZk6ishvF0SOtioTtQAkvjFHCSvXbgByfwUcKVg9mYbq0YGGJEycOv4QLANsKWU0mwksn88Mt+Swtz/curtPFxzXdd13QN5uOC6If/h4sAmygSeFChSANTisWrpRLjUCf33GhWHLwpBJtyEA5ydavFv3csIz/M8bb4kVR0ECc/zVsMwMaCsRNXlYJhcRyn3D4Ur1qYh+Vt7fOq2eKmxG6iqWJ2yTKIBHKQYzp79aOqDq9Gay5x5fapnfRChDzVA0Y8nrP8oCKxS7OfHUrFoXpt+OtW7/hxiqMubhcgfVkQPQH1aNB4+W6++lUSxy5tq5I8c8TUX4rUosW79HOpRKqtKAEIHvbD/59kCKGhsoJLnhY+/nu7SX9Q93GKU/B1G2QJqZMtYiwPwDRRPTAMqipBM+ssCfd3tn2sLqA5jfmlpkXkHYMo2GROOryoFeK+B7zSZZwcdKdqQ6NgQw2jJTpKvtzSQSj55MU+CuvGVjtddba65CKEUqY7xXPRcdV3X3cvhMueP7M/90+hBQUbMnAYLJC7USokVsFNiD8wh0uapXrYcF6iV6mWwHA8kh8uk9XAYOSK9x5h2UceJJfkw1A9lZymKC/wlUNpXelD5moyGpbAmBX4rzQMUu/pE6RZ9VVcN4lYDV9zFn9PUo6XDEd/3VPTcJfGb2rYN3M6Cf+fgClD9S+HcgupqCg7fAnABvwhQdefC1Q3zfXeum9tj/a3rsBxvI9qkv7DWp5tiO/nwXGVqu/RP/3dzY5cCeywHBVjJGz/NbBf+J9NcMUw4lmPqt4+ofL99+m3X/mqs/wglzlVOboj/geWN8FPsV/wwDZYDUC/Dm+9yfvj0uvibGBc1BArAY9e3XeuzUQe2dFrmR0JhaEoE4yrUSSM5gEsNNmRUujrga0rAGC0lzSoB+AOgg8bpkDMS0tHN1RA406u/CEC3UpdDZLOKWovob2TrWuO2vkv1wq8Z6dP8TZ1Ynp29XW6eF3Hh8mnjbPeO0wM/C9QogzBEHzeBttucDp32Rhlu4Gho/t8neunzKjlUAqg9ALDn4y/3NlfOYpyvs3nPsPPSOudTjeN3icJfW10V5+vEJHV4+mKhqX62jcwfaPVn67G51FFJNE2vHln0crM/FuiNrweEUQhNp0Mr6wvdti210PS4F46te34Xfq1dOWRYerSUlq2HvqLfM6kTnTfttM+bxsWTtlzJ9cK3ux6W28btLFiLfnN/pdpbI3XGz5RUsbPkslOtZSnzeNP8sNBVH7Sbq321afxqh6Z7vCtCadP4TdXLuMKeV2HpM4cZO/KUeFZ8wRPFqBPk12OAV8lQ9I+DGAs5zNT05uMnlHOP5GK4FS0BLTQJ5iXo0LSF1DPzsxq7vxsdO/wMgKmnQLVn/26fGjUlTIwVQYw43v2U8bYYB5Y1wZl+WYM9pAE7N7uVvm3LLfx4A/rH35JxPd9OeGAtii3g99Q/Ik0ol3aEn+BfjvJO2W/OCnP8P3Zs/AvnD67yiBBiFQAAAABJRU5ErkJggg==" alt="ut0p13 4 My SUN"></div><small style="color:#95a5a6">By Fred Vedrenne</small></div>'+tabs.map((x,i)=>'<button data-tab="'+i+'" class="'+(tab===i?'active':'')+'">'+(i+1)+'. '+x+'</button>').join('');
const del=(t,x)=>'<button data-remove="'+t+'" data-id="'+x.id+'">Supprimer</button>';
let out='';
if(tab===0){const receipts=db.entries.filter(x=>x.type==='recette').reduce((s,x)=>s+Number(x.amount),0),costs=db.entries.filter(x=>x.type==='depense').reduce((s,x)=>s+Number(x.amount),0);
out=section('Vue d’ensemble','<div class="grid"><div><small>Biens</small><div class="metric">'+db.properties.length+'</div></div><div><small>Recettes saisies</small><div class="metric">'+money(receipts)+'</div></div><div><small>Dépenses saisies</small><div class="metric">'+money(costs)+'</div></div><div><small>Solde de trésorerie simplifié</small><div class="metric">'+money(receipts-costs)+'</div></div></div>')+section('Contrôles préliminaires','<p>'+(db.owners.length?'✓ Propriétaire renseigné':'⚠ Aucun propriétaire')+'</p><p>'+(db.properties.length?'✓ Bien renseigné':'⚠ Aucun bien')+'</p><p>'+(db.years.length?'✓ Exercice créé':'⚠ Aucun exercice')+'</p><p class="muted">Ce solde ne constitue ni un résultat fiscal ni une liasse comptable.</p>')}
if(tab===0)out+=section('Sauvegarder ou restaurer un projet','<p>La sauvegarde JSON comprend toutes les données du projet et les pièces jointes. La restauration remplace le projet actuellement ouvert.</p><div class="actions"><button class="primary" id="export">Sauvegarder le projet (JSON)</button><label for="dashboardImport" class="btn" style="display:inline-block;margin:0">Restaurer un projet (JSON)</label><input type="file" id="dashboardImport" accept=".json,application/json" style="position:absolute;width:1px;height:1px;opacity:0" aria-label="Fichier de sauvegarde JSON"></div><p class="muted">Conservez ce fichier dans un emplacement privé : les données ne sont pas chiffrées.</p>');
if(tab===1)out=section('Ajouter un propriétaire',form('owner',fields([['name','Nom et prénom'],['siret','SIRET','text',false],['email','E-mail','email',false]])))+section('Propriétaires',table(['Nom','SIRET',''],db.owners.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.siret)+'</td><td>'+del('owners',x)+'</td></tr>')));
if(tab===2)out=section('Ajouter un bien',db.owners.length?form('property','<div><label>Propriétaire</label><select name="ownerId">'+options(db.owners,'name')+'</select></div>'+fields([['name','Nom du bien'],['address','Adresse'],['surface','Surface (m²)','number',false]])):'Créez d’abord un propriétaire.')+section('Biens',table(['Nom','Adresse',''],db.properties.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.address)+'</td><td>'+del('properties',x)+'</td></tr>')));
if(tab===3)out=section('Nouvelle écriture',db.properties.length?form('entry','<div><label>Bien</label><select name="propertyId">'+options(db.properties,'name')+'</select></div><div><label>Nature</label><select name="type"><option value="recette">Recette</option><option value="depense">Dépense</option></select></div>'+fields([['date','Date','date'],['label','Libellé'],['amount','Montant (€)','number']])):'Créez d’abord un bien.')+section('Journal des écritures',table(['Date','Nature','Libellé','Montant',''],db.entries.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.type)+'</td><td>'+esc(x.label)+'</td><td>'+money(Number(x.amount))+'</td><td>'+del('entries',x)+'</td></tr>')));
if(tab===7)out=section('Ajouter un justificatif','<p class="muted">Les fichiers sont intégrés à la sauvegarde JSON (Base64). Privilégiez des PDF de taille raisonnable.</p><form id="document"><div class="grid"><div><label>Nom</label><input name="name" required></div><div><label>Fichier</label><input name="file" type="file" accept=".pdf,image/*" required></div></div><div class="actions"><button class="primary">Ajouter</button></div></form>')+section('Documents',table(['Nom','Taille','Actions'],db.documents.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+Math.ceil(x.size/1024)+' Ko</td><td><button data-download="'+x.id+'">Télécharger</button> '+del('documents',x)+'</td></tr>')));
if(tab===9)out=section('Créer un exercice',form('year',fields([['year','Année','number']])))+section('Exercices',table(['Année','Statut',''],db.years.map(x=>'<tr><td>'+esc(x.year)+'</td><td>En cours — clôture non implémentée</td><td>'+del('years',x)+'</td></tr>')));
if(tab===4)out=section('Plan comptable — préparation','<p>Référentiel de comptes et affectation des écritures aux catégories comptables. À intégrer avec les imports CSV/XLSX/ODS et les règles de rapprochement des relevés de syndic.</p><p class="warn">Module en préparation : aucune affectation automatique active.</p>');
if(tab===5)out=section('Immobilisations et amortissements','<p>Gestion prévue : valeur d’origine, date de mise en service, durée, composants, amortissements antérieurs et reports par exercice.</p><p class="warn">Calcul des dotations non implémenté. Les amortissements historiques doivent être vérifiés avant intégration.</p>');
if(tab===6)out=section('Fiscalité et déclarations','<p>Préparation des déclarations 2031, tableaux 2033 et report vers la 2042-C-PRO, selon le régime fiscal applicable.</p><p class="warn">Aucun montant fiscal n’est calculé ni validé dans cette version.</p>');
if(tab===8)out=section('Dossier de contrôle fiscal','<p>Objectif : associer à chaque exercice les écritures, justificatifs, rapprochements syndic, amortissements et déclarations, puis produire un export annuel vérifiable.</p><p class="warn">Contrôle documentaire automatisé en préparation.</p>');
if(tab===10)out=section('Paramètres du dossier',form('settings',fields([['entity','Dénomination / activité','text',false],['regime','Régime fiscal','text',false],['startYear','Premier exercice','number',false]])))+section('Configuration','<p>Les paramètres sont enregistrés dans le dossier et inclus dans les exports JSON.</p><div id="settingsSummary"></div>');
if(tab===11)out=section('Sauvegarde complète','<p>Export JSON : données et pièces jointes incluses. Fichier non chiffré : à conserver dans un emplacement privé.</p><div class="actions"><button id="export" class="primary">Exporter le JSON</button></div>')+section('Restaurer un dossier','<p class="warn">L’import remplace intégralement les données actuelles du navigateur. Exportez-les auparavant.</p><input type="file" id="import" accept=".json">')+section('Confidentialité','<p>Stockage local du navigateur uniquement. Aucune synchronisation Drive dans cette version. Ne saisissez pas de données sensibles sur un poste partagé.</p>');
$('app').innerHTML=out;if(tab===10){const p=db.settings||{};for(const k of ['entity','regime','startYear'])if($('settings').elements[k])$('settings').elements[k].value=p[k]||'';$('settingsSummary').textContent='Dénomination : '+(p.entity||'Non renseignée')+' — Régime : '+(p.regime||'Non renseigné')}
}
function download(name,content,type){const blob=content instanceof Blob?content:new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab!==undefined){tab=Number(b.dataset.tab);render()}if(b.dataset.remove)remove(b.dataset.remove,b.dataset.id);if(b.dataset.download){const d=db.documents.find(x=>x.id===b.dataset.download);if(d)download(d.filename,fetchData(d.data),d.mime)}if(b.id==='export')download('LMNP-Manager-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json')});
function fetchData(uri){const [meta,data]=uri.split(',');const binary=atob(data),arr=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)arr[i]=binary.charCodeAt(i);return new Blob([arr])}
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;if(f.id==='settings'){db.settings=Object.fromEntries(new FormData(f));persist();return}if(f.id==='owner')add('owners','owner');if(f.id==='property')add('properties','property');if(f.id==='entry'){const amount=Number(f.elements.amount.value);if(!Number.isFinite(amount)||amount<0)return alert('Montant invalide');add('entries','entry')}if(f.id==='year'){if(db.years.some(x=>x.year===f.elements.year.value))return alert('Exercice déjà présent');add('years','year')}if(f.id==='document'){const file=f.elements.file.files[0];if(!file)return;if(file.size>15*1024*1024)return alert('Fichier supérieur à 15 Mo : compressez-le avant import.');const reader=new FileReader();reader.onload=()=>{db.documents.push({id:id(),name:f.elements.name.value,filename:file.name,mime:file.type||'application/octet-stream',size:file.size,data:reader.result});persist()};reader.readAsDataURL(file)}});
document.addEventListener('change',async e=>{if(e.target.id!=='import'&&e.target.id!=='dashboardImport')return;const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.schema!==1||!['owners','properties','entries','documents','years'].every(k=>Array.isArray(obj[k])))throw Error('Format incompatible');if(!confirm('Remplacer toutes les données locales par cette sauvegarde ?'))return;db=obj;persist();alert('Restauration effectuée')}catch(err){alert('Import impossible : '+err.message)}});
try{const saved=localStorage.getItem(KEY);if(saved){const obj=JSON.parse(saved);if(obj.schema===1)db=obj}}catch(e){alert('Lecture du stockage local impossible : '+e.message)}render();
</script></body></html>
