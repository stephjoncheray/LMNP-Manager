const taxLabel={a_verifier:'À vérifier',charge_validee:'Charge validée',non_deductible:'Non déductible',immobilisation:'Immobilisation'};
function taxStatus(x){return TAX_STATUSES.includes(x.taxStatus)?x.taxStatus:'a_verifier'}
function ensureAssets(){if(!Array.isArray(db.assets))db.assets=[];if(!Array.isArray(db.carryforwards))db.carryforwards=[];if(!Array.isArray(db.deficits))db.deficits=[];if(!Array.isArray(db.signatureRequests))db.signatureRequests=[]}
function assetSchedule(a,year){const value=Number(a.value),duration=Number(a.duration),start=new Date(String(a.startDate)+'T12:00:00');if(!(value>0&&duration>0&&duration<=100)||Number.isNaN(start.getTime()))return 0;const begin=start.getFullYear(),end=begin+Math.ceil(duration);if(year<begin||year>end)return 0;const annual=value/duration;const y0=new Date(year,0,1,12),y1=new Date(year+1,0,1,12),assetEnd=new Date(start.getTime());assetEnd.setFullYear(assetEnd.getFullYear()+duration);const lo=Math.max(start.getTime(),y0.getTime()),hi=Math.min(assetEnd.getTime(),y1.getTime());return Math.max(0,annual*(hi-lo)/(y1.getTime()-y0.getTime()))}

function fields(names){return names.map(([k,l,t='text',required=true])=>'<div><label>'+l+'</label><input name="'+k+'" type="'+t+'" '+(required?'required':'')+'></div>').join('')}

function options(items,field){return items.map(x=>'<option value="'+esc(x.id)+'">'+esc(x[field])+'</option>').join('')}
function section(title,body){return '<section class="panel"><h2>'+title+'</h2>'+body+'</section>'}

function add(type,formId,extra={}){const f=$(formId);if(!f.reportValidity())return;const obj=Object.fromEntries(new FormData(f));db[type].push({id:id(),...obj,...extra});persist()}
function edit(type,item){editing[type]=item;tab=type==='owners'?1:2;render()}
function cancelEdit(type){editing[type]=null;render()}
function saveRecord(type,formId){const f=$(formId);if(!f.reportValidity())return;const obj=Object.fromEntries(new FormData(f));const key=editing[type];if(key){const rec=db[type].find(x=>x.id===key);if(!rec)return alert('Élément introuvable');Object.assign(rec,obj)}else db[type].push({id:id(),...obj});editing[type]=null;persist()}
async function suggestCities(cp){const f=$('property');if(!f)return;const city=f.elements.city;if(!/^\d{5}$/.test(cp)){city.removeAttribute('list');return}try{const res=await fetch('https://geo.api.gouv.fr/communes?codePostal='+encodeURIComponent(cp)+'&fields=nom&format=json');if(!res.ok)throw Error('Service indisponible');const data=await res.json();if(f.elements.postalCode.value!==cp)return;const dl=$('citySuggestions');if(!dl)return;dl.replaceChildren(...data.map(c=>{const o=document.createElement('option');o.value=c.nom;return o}));city.setAttribute('list','citySuggestions');if(data.length===1&&!city.value)city.value=data[0].nom}catch(err){console.warn('Recherche des villes indisponible',err)}}

if(tab===0){const receipts=db.entries.filter(x=>x.type==='recette').reduce((s,x)=>s+Number(x.amount),0),costs=db.entries.filter(x=>x.type==='depense').reduce((s,x)=>s+Number(x.amount),0);
out=section('Vue d’ensemble','<div class="grid"><div><small>Biens</small><div class="metric">'+db.properties.length+'</div></div><div><small>Recettes saisies</small><div class="metric">'+money(receipts)+'</div></div><div><small>Dépenses saisies</small><div class="metric">'+money(costs)+'</div></div><div><small>Solde de trésorerie simplifié</small><div class="metric">'+money(receipts-costs)+'</div></div></div>')+section('Contrôles préliminaires','<p>'+(db.owners.length?'✓ Propriétaire renseigné':'⚠ Aucun propriétaire')+'</p><p>'+(db.properties.length?'✓ Bien renseigné':'⚠ Aucun bien')+'</p><p>'+(db.years.length?'✓ Exercice créé':'⚠ Aucun exercice')+'</p><p class="muted">Ce solde ne constitue ni un résultat fiscal ni une liasse comptable.</p>')}

function validateBackup(obj){if(!obj||obj.schema!==1||!['owners','properties','entries','documents','years'].every(k=>Array.isArray(obj[k])))return false;if(['assets','carryforwards','deficits','signatureRequests'].some(k=>obj[k]!==undefined&&!Array.isArray(obj[k])))return false;const ids=arr=>arr.every(x=>x&&typeof x.id==='string'&&x.id.length>0)&&new Set(arr.map(x=>x.id)).size===arr.length;if(!['owners','properties','entries','documents','years'].every(k=>ids(obj[k])))return false;if(!['assets','deficits','signatureRequests'].every(k=>obj[k]===undefined||ids(obj[k])))return false;const owners=new Set(obj.owners.map(x=>x.id)),properties=new Set(obj.properties.map(x=>x.id));if(obj.properties.some(x=>!owners.has(x.ownerId)))return false;if(obj.entries.some(x=>!properties.has(x.propertyId)||!Number.isFinite(Number(x.amount))||Number(x.amount)<0))return false;const documents=new Set(obj.documents.map(x=>x.id));if((obj.signatureRequests||[]).some(x=>!properties.has(x.propertyId)||!documents.has(x.documentId)||!['sur_place','distance'].includes(x.mode)||!['bail','edl_entree','edl_sortie','avenant'].includes(x.kind)||!Array.isArray(x.signers)||!x.signers.length||x.signers.some(y=>!y.name)))return false;if(obj.entries.some(x=>x.documentId&&!documents.has(x.documentId)))return false;if((obj.assets||[]).some(x=>!properties.has(x.propertyId)||!(Number(x.value)>0)||!(Number(x.duration)>0)))return false;if((obj.carryforwards||[]).some(x=>!Number.isFinite(Number(x.amount))||Number(x.amount)<0))return false;if((obj.deficits||[]).some(x=>!Number.isFinite(Number(x.amount))||Number(x.amount)<0))return false;return true}
function fetchData(uri){const [meta,data]=uri.split(',');const binary=atob(data),arr=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)arr[i]=binary.charCodeAt(i);return new Blob([arr])}
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;if(f.id==='settings'){db.settings=Object.fromEntries(new FormData(f));persist();return}if(f.id==='owner')saveRecord('owners','owner');if(f.id==='property')saveRecord('properties','property');if(f.id==='entry'){const amount=Number(f.elements.amount.value);if(!Number.isFinite(amount)||amount<0)return alert('Montant invalide');add('entries','entry')}if(f.id==='signatureRequest'){ensureAssets();const data=Object.fromEntries(new FormData(f));const signers=String(data.signers||'').split(/\r?\n/).map(line=>line.trim()).filter(Boolean).map(line=>{const parts=line.split(';');return {name:(parts[0]||'').trim(),email:(parts[1]||'').trim()}});if(!db.properties.some(p=>p.id===data.propertyId)||!db.documents.some(d=>d.id===data.documentId&&((d.mime==='application/pdf')||String(d.filename).toLowerCase().endsWith('.pdf')))||!signers.length||signers.some(x=>!x.name))return alert('Sélectionnez un bien, un PDF et des signataires valides.');db.signatureRequests.push({id:id(),propertyId:data.propertyId,documentId:data.documentId,kind:data.kind,mode:data.mode,signers,createdAt:new Date().toISOString(),status:'preparation'});persist();return}if(f.id==='deficit'){ensureAssets();const year=Number(f.elements.originYear.value),amount=Number(f.elements.amount.value);if(!Number.isInteger(year)||year<1900||year>=Number(fiscalYear)||!Number.isFinite(amount)||amount<=0)return alert('Année d’origine antérieure à l’exercice et montant positif requis.');if(db.deficits.some(x=>Number(x.originYear)===year))return alert('Cette année existe déjà : supprimez ou corrigez la ligne avant de la remplacer.');db.deficits.push({id:id(),originYear:String(year),amount});persist();return}if(f.id==='asset'){ensureAssets();const v=Number(f.elements.value.value),d=Number(f.elements.duration.value),h=Number(f.elements.historical.value||0);if(!(v>0&&d>0&&d<=100&&h>=0&&h<=v))return alert('Vérifiez la base, la durée et les amortissements antérieurs.');add('assets','asset');return}if(f.id==='year'){if(db.years.some(x=>x.year===f.elements.year.value))return alert('Exercice déjà présent');add('years','year')}if(f.id==='document'){const file=f.elements.file.files[0];if(!file)return;if(file.size>15*1024*1024)return alert('Fichier supérieur à 15 Mo : compressez-le avant import.');const reader=new FileReader();reader.onload=()=>{db.documents.push({id:id(),name:f.elements.name.value,filename:file.name,mime:file.type||'application/octet-stream',size:file.size,data:reader.result});persist()};reader.readAsDataURL(file)}});
document.addEventListener('change',e=>{if(e.target.matches('#entry [name="type"]')){const f=e.target.form,sel=f.elements.category;sel.innerHTML=ENTRY_CATEGORIES[e.target.value].map(x=>'<option>'+esc(x)+'</option>').join('')}});
let cityLookupTimer;document.addEventListener('input',e=>{if(e.target.matches('#property [name="postalCode"]')){clearTimeout(cityLookupTimer);cityLookupTimer=setTimeout(()=>suggestCities(e.target.value),250)}});
document.addEventListener('change',async e=>{if(e.target.matches('[data-entry-document]')){const x=db.entries.find(z=>z.id===e.target.dataset.entryDocument);if(x){x.documentId=e.target.value;persist()}return}if(e.target.matches('[data-tax-entry]')){const x=db.entries.find(z=>z.id===e.target.dataset.taxEntry);if(x&&x.type==='depense'&&TAX_STATUSES.includes(e.target.value)){x.taxStatus=e.target.value;persist()}return}if(e.target.id==='signatureSigner'){signingIndex=Number(e.target.value);render();setupSignatureCanvas();return}if(e.target.id==='fiscalCarry'){ensureAssets();const amount=Number(e.target.value);if(!Number.isFinite(amount)||amount<0)return alert('Report invalide');const item=db.carryforwards.find(x=>x.year===fiscalYear);if(item)item.amount=amount;else db.carryforwards.push({year:fiscalYear,amount});persist();return}if(e.target.id==='fiscalYear'){fiscalYear=e.target.value;render();return}if(e.target.id==='fiscalProperty'){fiscalProperty=e.target.value;render();return}if(e.target.id==='assetYear'){assetYear=e.target.value;render();return}if(e.target.id==='entryYearFilter'){entryYearFilter=e.target.value;render();return}if(e.target.id==='entryPropertyFilter'){entryPropertyFilter=e.target.value;render();return}if(e.target.id==='import' || e.target.id==='dashboardImport'){}else return;if(e.target.id!=='import'&&e.target.id!=='dashboardImport')return;const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!validateBackup(obj))throw Error('Sauvegarde invalide : structure ou références incohérentes');if(!confirm('Remplacer toutes les données locales par cette sauvegarde ? Une copie du dossier actuel sera téléchargée avant remplacement.'))return;download('LMNP-avant-restauration-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json');db=obj;ensureAssets();persist();alert('Restauration effectuée')}catch(err){alert('Import impossible : '+err.message)}});
try{const saved=localStorage.getItem(KEY);if(saved){const obj=JSON.parse(saved);if(obj.schema===1){db=obj;ensureAssets()}}}catch(e){alert('Lecture du stockage local impossible : '+e.message)}render();
</script></body></html>
